name: release

# Builds the Python distribution and the VSIX on a version tag and attaches them to a
# GitHub release. Publishing to PyPI / the VS Code Marketplace is intentionally a manual
# step (see docs/enterprise-deployment.md) until trusted publishing is configured.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Verify tag matches package version
        run: |
          python -m pip install -e "packages/scanner[dev]"
          version=$(aegisai version | awk '{print $2}')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package ${version}"; exit 1; }
      - name: Test
        working-directory: packages/scanner
        run: python -m pytest -q
      - name: Build Python distribution
        working-directory: packages/scanner
        run: python -m build
      - name: Build VSIX
        working-directory: apps/vscode-extension
        run: |
          npm ci
          npm run compile
          npm test
          npm run package
      - name: Clean-install check
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install packages/scanner/dist/*.whl
          /tmp/clean/bin/aegisai version
          /tmp/clean/bin/aegisai scan examples/secure-examples --no-integrations --no-progress --quiet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            packages/scanner/dist/*
            apps/vscode-extension/*.vsix

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "AegisAI ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md \
            artifacts/packages/scanner/dist/* artifacts/apps/vscode-extension/*.vsix
