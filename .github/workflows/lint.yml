name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/scanner/pyproject.toml
      - run: python -m pip install -e "packages/scanner[dev]"
      - name: Ruff lint
        working-directory: packages/scanner
        run: python -m ruff check src tests
      - name: Ruff format
        working-directory: packages/scanner
        run: python -m ruff format --check src tests
      - name: mypy (strict)
        working-directory: packages/scanner
        run: python -m mypy
      - name: Generated docs are up to date
        run: |
          python scripts/generate_rule_docs.py
          aegisai schema --output-dir docs/schema
          git diff --exit-code -- docs/supported-rules.md docs/schema

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/vscode-extension/package-lock.json
      - working-directory: apps/vscode-extension
        run: |
          npm ci
          npm run lint
