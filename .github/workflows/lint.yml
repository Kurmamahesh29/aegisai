name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/scanner/pyproject.toml
      - run: python -m pip install -e "packages/scanner[dev]"
      - name: Ruff lint
        working-directory: packages/scanner
        run: python -m ruff check src tests
      - name: Ruff format
        working-directory: packages/scanner
        run: python -m ruff format --check src tests
      - name: mypy (strict)
        working-directory: packages/scanner
        run: python -m mypy
      - name: Generated docs are up to date
        run: |
          python scripts/generate_rule_docs.py
          aegisai schema --output-dir docs/schema
          git diff --exit-code -- docs/supported-rules.md docs/schema

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/vscode-extension/package-lock.json
      - working-directory: apps/vscode-extension
        run: |
          npm ci
          npm run lint
