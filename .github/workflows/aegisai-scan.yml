name: aegisai-scan

# Reusable workflow. Call it from another repository or workflow:
#
#   jobs:
#     aegisai:
#       uses: Kurmamahesh29/aegisai/.github/workflows/aegisai-scan.yml@v0.1.0
#       with:
#         profile: all
#         fail-on: high
#         upload-sarif: true
#       permissions:
#         contents: read
#         security-events: write   # only when upload-sarif is true
#
# Exit codes: 1 = findings at/above fail-on (vulnerabilities); 2 = scanner failure;
# 3 = incomplete (required scanner unavailable / timeout). Only 1 means "your code has
# findings"; 2 and 3 are infrastructure problems and are reported as such in the summary.

on:
  workflow_call:
    inputs:
      path:
        description: Directory to scan (relative to the repository root).
        type: string
        default: "."
      profile:
        description: Scan profile (all, ai, llm, agents, rag, mcp, code, secrets, dependencies).
        type: string
        default: "all"
      fail-on:
        description: Severity threshold that fails the job (critical, high, medium, low, informational, none).
        type: string
        default: "high"
      aegisai-version:
        description: AegisAI version specifier for pip (e.g. "==0.1.0"). Empty installs from this repository.
        type: string
        default: ""
      install-gitleaks:
        type: boolean
        default: true
      install-osv-scanner:
        type: boolean
        default: true
      strict:
        description: Treat enabled-but-unavailable scanners as a failure (exit 3).
        type: boolean
        default: true
      upload-sarif:
        description: Publish results to GitHub code scanning (requires security-events write permission).
        type: boolean
        default: false
      baseline:
        description: Optional baseline file path relative to the repository root.
        type: string
        default: ""
      python-version:
        type: string
        default: "3.12"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install AegisAI
        run: |
          if [ -n "${{ inputs.aegisai-version }}" ]; then
            python -m pip install "aegisai${{ inputs.aegisai-version }}"
          elif [ -d packages/scanner ]; then
            python -m pip install "packages/scanner"
          else
            python -m pip install aegisai
          fi
          aegisai version
      - name: Install Gitleaks
        if: inputs.install-gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Install OSV-Scanner
        if: inputs.install-osv-scanner
        run: |
          set -euo pipefail
          OSV_VERSION=2.7.0
          curl -sSL -o /tmp/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          sudo install /tmp/osv-scanner /usr/local/bin/osv-scanner
      - name: Scanner availability
        run: aegisai doctor
      - name: Scan
        id: scan
        run: |
          set +e
          args=(scan "${{ inputs.path }}" --profile "${{ inputs.profile }}" --fail-on "${{ inputs.fail-on }}" --no-progress
                --format terminal --format json --format sarif
                --output aegisai-reports/report.json --output aegisai-reports/report.sarif)
          if [ "${{ inputs.strict }}" = "true" ]; then args+=(--strict); fi
          if [ -n "${{ inputs.baseline }}" ]; then args+=(--baseline "${{ inputs.baseline }}"); fi
          aegisai "${args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case $code in
            0) echo "AegisAI: no findings at or above ${{ inputs.fail-on }}" >> "$GITHUB_STEP_SUMMARY" ;;
            1) echo "AegisAI: findings at or above ${{ inputs.fail-on }} - see the report artifact" >> "$GITHUB_STEP_SUMMARY" ;;
            2) echo "AegisAI: scan FAILED (configuration or internal error, not a vulnerability)" >> "$GITHUB_STEP_SUMMARY" ;;
            3) echo "AegisAI: scan INCOMPLETE (required scanner unavailable or timeout, not a vulnerability)" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          exit $code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: aegisai-reports
          path: aegisai-reports/
      - name: Upload SARIF
        if: always() && inputs.upload-sarif && steps.scan.outputs.exit_code != '2'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: aegisai-reports/report.sarif
          category: aegisai
